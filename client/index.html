<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Tdesse Birara | Full-Stack Software Engineer</title>

  <meta name="description"
    content="Explore Tdesse Birara's software engineering portfolio, featuring full-stack web development, React, TypeScript, Node.js, PostgreSQL, and modern software solutions." />

  <meta name="author" content="Tdesse Birara" />

  <meta name="robots" content="index, follow" />

  <!-- Replace with your actual deployed domain -->
  <link rel="canonical" href="https://yourdomain.com/" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
  <meta property="og:type" content="website" />

  <meta property="og:title" content="Tdesse Birara | Full-Stack Software Engineer" />

  <meta property="og:description"
    content="Discover my software engineering projects, technical skills, and experience building modern web applications." />

  <meta property="og:image" content="https://yourdomain.com/profile.jpg" />

  <meta property="og:image:alt" content="Tdesse Birara - Software Engineer" />

  <meta property="og:url" content="https://yourdomain.com/" />

  <meta property="og:site_name" content="Tdesse Birara Portfolio" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:title" content="Tdesse Birara | Full-Stack Software Engineer" />

  <meta name="twitter:description" content="Explore my software engineering portfolio and development projects." />

  <meta name="twitter:image" content="https://yourdomain.com/profile.jpg" />

  <!-- Browser Theme -->
  <meta name="theme-color" content="#090D16" />

  <!-- Structured Data: Person -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Tdesse Birara",
      "url": "https://yourdomain.com/",
      "jobTitle": "Software Engineer",
      "knowsAbout": [
        "Full-Stack Web Development",
        "React",
        "TypeScript",
        "JavaScript",
        "Node.js",
        "Express.js",
        "PostgreSQL",
        "Software Engineering",
        "System Design"
      ]
    }
  </script>

</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
